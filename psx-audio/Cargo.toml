[package]
name = "psx-audio"
description = "PlayStation audio: an SPU voice engine, XA and CD-DA playback, file sources and WAV/FLAC/Ogg export"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
keywords = ["playstation", "audio", "psx", "spu", "adpcm"]
categories = ["multimedia::audio", "game-development", "no-std"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "CHANGELOG.md"]
publish = false

[features]
default = ["std", "ogg"]
# File, folder and disc-image access.
std = ["dep:psx-cd"]
# Ogg Vorbis export through the bundled libvorbis; adds a C compiler at build time.
ogg = ["std", "dep:vorbis_rs"]

[dependencies]
flacenc = { version = "0.5.1", default-features = false, features = ["par"] }
psx-cd = { version = "0.1.1", path = "../psx-cd", optional = true }
psx-formats = { version = "0.1.1", path = "../psx-formats", default-features = false }
vorbis_rs = { version = "0.5.6", optional = true }

[dev-dependencies]
psx-cd = { version = "0.1.1", path = "../psx-cd" }
psx-formats = { version = "0.1.1", path = "../psx-formats", features = ["fixtures"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package.metadata.docs.rs]
all-features = true
