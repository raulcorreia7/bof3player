name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Install make on Windows
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build all tools
        run: make build
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          name="bof3player-${PLATFORM}"
          mkdir -p "$name/data" dist
          suffix=""
          if [[ "$OS" == Windows ]]; then suffix=.exe; fi
          for tool in bof3player bof3player-tui bof3player-gui; do
            cp "target/release/${tool}${suffix}" "$name/"
          done
          cp data/bof3-names.json "$name/data/"
          cp README.md LICENSE "$name/"
          if [[ "$OS" == Windows ]]; then
            7z a "dist/${name}.zip" "$name" >/dev/null
            archive="${name}.zip"
          else
            tar -czf "dist/${name}.tar.gz" "$name"
            archive="${name}.tar.gz"
          fi
          cd dist
          if [[ "$OS" == macOS ]]; then
            shasum -a 256 "$archive" > "${archive}.sha256"
          else
            sha256sum "$archive" > "${archive}.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
