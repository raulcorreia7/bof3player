# cargo-deny policy: permissive licenses only. Check with `cargo deny check`.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "NCSA",
]

# Unmaintained crates that the optional `gui` feature (gpui) pulls in. None is a vulnerability
# report. Remove an entry when gpui drops the crate.
[advisories]
ignore = [
    "RUSTSEC-2025-0052", # async-std
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0134", # rustls-pemfile
    "RUSTSEC-2026-0206", # rustybuzz
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0372", # zvariant_derive
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
