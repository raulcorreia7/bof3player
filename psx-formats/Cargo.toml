[package]
name = "psx-formats"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PlayStation formats: SPU and XA ADPCM, VAB sound banks, SEP sequences, Mode 2 sectors, WAVE, VRAM uploads, CLUTs and TIM images"
license = "MIT"
readme = "README.md"
keywords = ["playstation", "psx", "adpcm", "vab", "tim"]
categories = ["multimedia::audio", "multimedia::images", "parser-implementations", "no-std"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "CHANGELOG.md"]
publish = false

[features]
default = ["std"]
# VRAM uploads, CLUT palettes and PNG output (files, JSON). Without it the crate is `no_std + alloc`.
std = ["dep:png", "dep:serde", "dep:serde_json"]
# Test banks, sequences and sectors for the crates that build on this one.
fixtures = []

[dependencies]
png = { version = "0.18.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
